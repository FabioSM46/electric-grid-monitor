version: '3.8'

services:
  grid-monitor:
    build: .
    container_name: electric-grid-monitor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - DB_PATH=/app/data/grid_monitor.db
      - LOG_FILE=/app/logs/monitor.log
    networks:
      - grid-network

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
    networks:
      - grid-network
    depends_on:
      - grid-monitor

volumes:
  grafana-storage:

networks:
  grid-network:
    driver: bridge